# Generated as config/bot.toml on first run. Do not put AppSecret or tokens here.

[qq]
enabled = true
environment = "production"
transport = "websocket"
public_guild_messages = false
extended_events = false
check_only = false

[qq.webhook]
listen = "127.0.0.1:8080"
path = "/callbacks/qq"
timestamp_tolerance_seconds = 300
max_body_bytes = 1048576
max_request_concurrency = 64
request_timeout_seconds = 10

[onebot11]
enabled = false
listen = "127.0.0.1:6700"
# Set only for a trusted private network; prefer loopback behind a TLS reverse proxy.
allow_insecure_remote = false
action_timeout_seconds = 15
max_message_bytes = 1048576
max_pending_actions = 256

[runtime]
queue_capacity = 32
event_concurrency = 32
handler_timeout_seconds = 30
shutdown_timeout_seconds = 20
dedup_capacity = 16384

[management]
enabled = false
listen = "127.0.0.1:9090"

[plugins]
database = "data/plugins.db"
# installations = "config/plugins.toml"
marketplace_url = "https://bkmqb-plugins.github.io/marketplace/index.json"

[logging.console]
enabled = true
language = "en"
ansi = true
filter = "info"
message_content = false

[logging.files]
enabled = true
directory = "logs"
filter = "debug"
message_content = false
zstd_level = 3
buffer_lines = 8192
runtime_max_file_mb = 64
runtime_max_total_mb = 512
messages_max_file_mb = 256
messages_max_total_mb = 2048
