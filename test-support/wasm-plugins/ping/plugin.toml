manifest_version = 1
id = "dev.bkm.wasm-ping"
version = "0.1.0"
protocol = ">=1.0,<2.0"
entry = "component.wasm"

[metadata]
default_locale = "en"

[metadata.locales.en]
name = "WASM Ping"
description = "BPP Component Model ping equivalence fixture"

[runtime]
mode = "serial"
max_concurrency = 1
timeout_ms = 3000
memory_mb = 16
fuel = 10000000

[[subscriptions]]
id = "messages"
event = "message.created"
priority = 0
scopes = ["group", "private", "channel"]

[[commands]]
name = "ping"
description = "Reply with pong"

[permissions]
actions = ["message.reply"]
event_extensions = []
storage = "none"
storage_quota_bytes = 0
scheduler = false
stop_propagation = false
