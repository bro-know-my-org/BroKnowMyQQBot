# Functional plugin profile for a real QQ Official WebSocket smoke test.
# Test-only fault fixtures remain excluded from the production application.
bundled = [
    "ping",
    "help",
    "echo",
    "counter",
    "http-probe",
    "browser-probe",
    "scheduler-probe",
    "qq-extension-probe",
    "active-send-probe",
    "devtools",
]

# Replace with the stable sender ID allowed to run privileged diagnostics.
[bundled_config.devtools]
owners = ["replace-with-qq-sender-id"]
